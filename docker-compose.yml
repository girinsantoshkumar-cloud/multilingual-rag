services:
  multilingual-rag:
    build:
      context: .
      dockerfile: Dockerfile
    image: multilingual-rag:local
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY:-change-this-in-production}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-26214400}"
      TOP_K: "${TOP_K:-5}"
      CMI_THRESHOLD: "${CMI_THRESHOLD:-0.20}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
      OLLAMA_TIMEOUT: "${OLLAMA_TIMEOUT:-120}"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
