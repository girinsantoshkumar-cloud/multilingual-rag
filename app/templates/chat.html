<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="shell"><nav aria-label="Primary"><a href="/">Upload</a><a class="active" href="/chat">Chat</a></nav><section class="card chat-card"><h1>Ask a question</h1><div id="chatWindow" class="chat-window" role="log" aria-live="polite"><p class="muted">Ask about the indexed documents.</p></div><form id="chatForm" class="chat-form"><label class="sr-only" for="userQuery">Your question</label><input id="userQuery" autocomplete="off" placeholder="Type your question…" required><button id="sendBtn" type="submit">Send</button></form><p id="meta" class="muted" aria-live="polite"></p></section></main>
<script>
const form=document.querySelector('#chatForm'), input=document.querySelector('#userQuery'), win=document.querySelector('#chatWindow'), meta=document.querySelector('#meta');
function add(role,text){const el=document.createElement('div');el.className='message '+role;el.textContent=text;win.appendChild(el);win.scrollTop=win.scrollHeight;}
form.addEventListener('submit',async e=>{e.preventDefault();const q=input.value.trim();if(!q)return;add('user',q);input.value='';input.disabled=true;document.querySelector('#sendBtn').disabled=true;meta.textContent='Retrieving…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});const d=await r.json();if(!r.ok)throw new Error(d.error);add('assistant',d.answer);meta.textContent=`CMI ${d.cmi} · matrix ${d.matrix_language} · views: ${d.views.map(v=>v.name).join(', ')}`;}catch(err){add('assistant','Sorry, the request failed: '+err.message);meta.textContent='';}finally{input.disabled=false;document.querySelector('#sendBtn').disabled=false;input.focus();}});
</script></body></html>
