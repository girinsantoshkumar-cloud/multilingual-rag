<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat</title><link rel="stylesheet" href="{{ url_for('style_asset') }}?v={{ style_version }}"></head>
<body><main class="site-shell chat-shell"><nav class="top-nav" aria-label="Primary navigation"><span class="nav-mark" aria-hidden="true">RAG</span><div class="nav-links"><a href="/">Upload</a><a class="active" href="/chat">Chat</a></div></nav><header class="page-heading compact-heading"><p class="eyebrow">Knowledge assistant</p><h1>Ask your documents</h1><p class="subtitle">Questions are answered using the files in your local library.</p></header><section class="panel chat-panel"><div id="chatWindow" class="chat-window" role="log" aria-live="polite"><div class="welcome-state"><span class="welcome-orb" aria-hidden="true">✦</span><strong>Your assistant is ready</strong><span class="muted">Ask a question in any supported language.</span></div></div><form id="chatForm" class="chat-form"><label class="sr-only" for="userQuery">Your question</label><textarea id="userQuery" rows="1" autocomplete="off" placeholder="Ask a question…" required></textarea><button id="sendBtn" class="send-button" type="submit" aria-label="Send question"><span aria-hidden="true">↑</span></button></form><p id="meta" class="meta-line" aria-live="polite"></p></section></main>
<script>
const form=document.querySelector('#chatForm'),input=document.querySelector('#userQuery'),send=document.querySelector('#sendBtn'),win=document.querySelector('#chatWindow'),meta=document.querySelector('#meta');
function resizeInput(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px';}input.addEventListener('input',resizeInput);input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();form.requestSubmit();}});
function addMessage(role,text){const el=document.createElement('div');el.className=`message ${role}`;const content=document.createElement('span');content.className='message-content';if(role==='user'&&text.length>320){content.classList.add('collapsed');content.textContent=text;const toggle=document.createElement('button');toggle.type='button';toggle.className='read-more';toggle.textContent='Read more';toggle.addEventListener('click',()=>{content.classList.toggle('collapsed');toggle.textContent=content.classList.contains('collapsed')?'Read more':'Show less';});el.append(content,toggle);}else{content.textContent=text;el.appendChild(content);}win.appendChild(el);win.scrollTop=win.scrollHeight;return el;}
function addThinking(){const el=document.createElement('div');el.className='message assistant thinking';el.innerHTML='<span class="spinner" aria-hidden="true"></span><span>Generating response…</span>';win.appendChild(el);win.scrollTop=win.scrollHeight;return el;}
form.addEventListener('submit',async event=>{event.preventDefault();const query=input.value.trim();if(!query)return;addMessage('user',query);input.value='';resizeInput();input.disabled=true;send.disabled=true;meta.textContent='Retrieving context and running the model…';const thinking=addThinking();try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Request failed');thinking.remove();addMessage('assistant',data.answer);meta.textContent=`CMI ${data.cmi} · ${data.matrix_language} · ${data.views.map(view=>view.name).join(' · ')}`;}catch(error){thinking.remove();addMessage('assistant',`Sorry, the request failed: ${error.message}`);meta.textContent='';}finally{input.disabled=false;send.disabled=false;input.focus();}});
</script></body></html>
