<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload documents</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<main class="shell"><nav aria-label="Primary"><a class="active" href="/">Upload</a><a href="/chat">Chat</a></nav>
<section class="card"><h1>Upload documents</h1><p class="muted">Add PDF, DOCX, or TXT files to the local knowledge index.</p>
<form id="uploadForm"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="fileInput">Documents</label><input id="fileInput" name="files" type="file" multiple accept=".pdf,.txt,.docx" aria-describedby="fileHelp"><small id="fileHelp">Maximum size: 25 MB per request.</small><button type="submit">Upload documents</button></form><p id="status" role="status" aria-live="polite"></p></section>
<section class="card"><h2>Indexed files</h2><ul id="documents">{% for document in documents %}<li><span>{{ document.filename }}</span><span class="pill">{{ document.chunks }} chunks</span></li>{% else %}<li class="muted">No documents indexed yet.</li>{% endfor %}</ul></section></main>
<script>
const form=document.querySelector('#uploadForm'), status=document.querySelector('#status');
form.addEventListener('submit',async e=>{e.preventDefault(); const files=document.querySelector('#fileInput').files; if(!files.length){status.textContent='Choose at least one file.';return;} status.textContent='Indexing…'; const r=await fetch('/api/upload',{method:'POST',body:new FormData(form)}); const d=await r.json(); status.textContent=r.ok?`Indexed ${d.indexed.length} file(s). Reloading…`:`Upload failed: ${d.error||d.errors?.map(x=>x.error).join(', ')}`; if(r.ok||r.status===207)setTimeout(()=>location.reload(),500);});
</script></body></html>
